<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tata Panorama</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
      }
      #panorama {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="panorama"></div>
    <script type="text/javascript" src="./assets/js/panorama.js"></script>
    <script>
      function getDeviceSettings() {
        // Detect if running inside an iframe
        const isIframe = window.self !== window.top;
        // If inside iframe, get width from parent or screen
        const width = screen.width || window.innerWidth;
        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
        const isTablet = /iPad|Tablet|Nexus 7|Nexus 10|KFAPWI/i.test(navigator.userAgent);
        if (isMobile) {
          return { hfov: 80, minHfov: 70, maxHfov: 80, multiResMinHfov: 80, multiResMaxHfov: 100 };
        } else if (isTablet) {
          return { hfov: 100, minHfov: 90, maxHfov: 100, multiResMinHfov: 80, multiResMaxHfov: 100 };
        } else {
          return { hfov: 100, minHfov: 90, maxHfov: 100, multiResMinHfov: 100, multiResMaxHfov: 100 };
        }
      }
      const settings = getDeviceSettings();
      viewer = pannellum.viewer("panorama", {
        default: {
          firstScene: "sierra",
          author: "",
          sceneFadeDuration: 0,
          autoLoad: true,
          showControls: false,
          // file:// cannot use CORS; omit crossOrigin so tiles load locally. Use http(s) + "anonymous" in production.
          crossOrigin: location.protocol === "file:" ? false : "anonymous",
        },
        scenes: {
          // Sierra Scene
          sierra: {
            title: "SIERRA",
            type: "multires",
            showControls: false,
            autoRotate: settings.autoRotate,
            hfov: settings.hfov,
            pitch: -10,
            maxLevel: 1,
            minHfov: settings.minHfov,
            maxHfov: settings.maxHfov,
            multiResMinHfov: settings.multiResMinHfov,
            multiResMaxHfov: settings.multiResMaxHfov,
            yaw: 0,
            compass: false,
            mouseZoom: true,
            draggable: true,
            friction: 0.02,
            velocityThreshold: 0.9,
            momentum: true,
            disableKeyboardCtrl: false,
            minPitch: -90,
            maxPitch: 90,
            vaov: 0,
            haov: 360,
            multiRes: {
              basePath: "assets/interior",
              path: "/%l/%s%y_%x",
              fallbackPath: "/fallback/%s",
              extension: "jpg",
              tileResolution: 512,
              maxLevel: 3,
              cubeResolution: 1296,
            },
          },
        },
      });
      // Recalculate on rotation / resize
      window.addEventListener("resize", () => {
        const newSettings = getDeviceSettings();
        viewer.setHfov(newSettings.hfov);
      });
    </script>
  </body>
</html>
